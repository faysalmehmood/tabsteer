<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Steer</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; padding: 14px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    .site { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .facts { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
    footer { display: flex; align-items: center; gap: 6px; }
    footer .note { flex: 1; margin: 0; }
    footer button { width: auto; margin: 0; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Tab Steer</h1>
    <span class="pill" id="status">…</span>
  </header>

  <section id="setup" hidden>
    <p class="note"><strong>The command-line companion isn't running.</strong><br>
      In a terminal, run <code>npm install -g tabsteer</code> and then <code>tabsteer install</code>.
      <a href="welcome.html" target="_blank">Setup guide</a></p>
    <p class="note" id="host-error"></p>
  </section>

  <section id="turn-on" hidden>
    <p class="note"><strong>Turn on Tab Steer</strong> (one time). Chrome will ask to let Tab Steer reach websites. Your agent still only gets the tabs you share, on the sites you allow.</p>
    <button class="primary" id="turn-on-button">Turn on</button>
  </section>

  <section id="tab">
    <div class="site" id="site">…</div>
    <div class="facts" id="facts"></div>
    <button class="primary" id="share" hidden>Share this tab with your agent</button>
    <button id="unshare" hidden>Stop sharing this tab</button>
    <button id="allow" hidden></button>
    <button class="link" id="revoke" hidden></button>
  </section>

  <footer>
    <p class="note" id="count"></p>
    <button id="panel">Activity</button>
    <button id="pause">Pause</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
